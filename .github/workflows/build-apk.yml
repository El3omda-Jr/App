name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: bash scripts/setup-android.sh
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
      - name: Sign (release) or collect (debug)
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" \
              --out out/AQUALIMA-SHAMS.apk aligned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/AQUALIMA-SHAMS-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AQUALIMA-SHAMS-apk
          path: out/*.apk
